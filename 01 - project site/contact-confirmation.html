<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Message Sent | Creggan Barbers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
  <style>
    body { 
      font-family: 'Oswald', sans-serif; 
      background-color: #111; 
      color: #f5f5f5; 
      text-align: center; 
      padding-top: 100px;
    }
    .btn-home { 
      background: #cfa144; 
      color: #111; 
      font-weight: 600; 
      padding: 10px 20px; 
      border: none; 
      margin-top: 30px;
    }
    .btn-home:hover { background: #e0b95a; color: #111; }
  </style>
</head>
<body>

  <h1>Thank You!</h1>
  <p id="contactMessage"></p>
  <button class="btn btn-home" onclick="goBack()">Back to Contact Page</button>

  <script>
    // Retrieve the name from sessionStorage
    const name = sessionStorage.getItem('contactName');
    document.getElementById('contactMessage').innerText = name 
      ? `Hi ${name}, your message has been sent successfully.` 
      : 'Your message has been sent successfully.';
    
    function goBack() {
      window.location.href = 'Contacts.html';
    }
  </script>

</body>
</html>
